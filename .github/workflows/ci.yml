name: ci

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: check_secrets (full history of the PR)
        run: python scripts/check_secrets.py --range origin/${{ github.base_ref }}..HEAD || exit $?
        if: github.event_name == 'pull_request'
      - name: check_secrets (every tracked file)
        run: python scripts/check_secrets.py --tree

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev]
      - run: ruff check src tests data scripts
      - run: python -m pytest -q

  dist:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: unpack the sdist and run the test suite from it
        run: |
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          cd sdist-test
          python -m venv .venv
          .venv/bin/python -m pip install ".[dev]"
          .venv/bin/python -m pytest -q
      - name: install the built wheel and run the CLI surface
        run: |
          python -m pip install dist/*.whl
          rashomon --version
          rashomon run --help >/dev/null
