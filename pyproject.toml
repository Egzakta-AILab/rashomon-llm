[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rashomon-llm"
version = "0.1.0"
description = "Measure how often an LLM endpoint returns different outcomes for identical request parameters under concurrent load."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Egzakta AI Lab" }]
keywords = ["llm", "inference", "nondeterminism", "measurement", "vllm", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core install: httpx for the endpoint, Pillow for the card. Statistics are pure
# stdlib (the cluster bootstrap comes from a private Egzakta repository; see NOTICE).
dependencies = ["httpx>=0.27", "Pillow>=10"]

[project.optional-dependencies]
# kept so `pip install rashomon-llm[card]` still resolves; Pillow is now a core dependency
card = []
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rashomon = "rashomon_llm.cli:main"
rashomon-llm = "rashomon_llm.cli:main"

[project.urls]
Homepage = "https://github.com/Egzakta-AILab/rashomon-llm"
Repository = "https://github.com/Egzakta-AILab/rashomon-llm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rashomon_llm = ["data/sets/*.jsonl", "data/sets/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint.per-file-ignores]
# stats.py: code taken unchanged from a private Egzakta repository (see NOTICE): do not restyle
"src/rashomon_llm/stats.py" = ["UP", "I"]
"scripts/check_secrets.py" = ["PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
